<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipo Adventure 🐶</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .bg-letter {
      background-image: url(./assets/letterbg.png);
      background-repeat: no-repeat;
      background-size: cover;
    }
    .bg {
      position: absolute;
      left: 0;
      bottom: 0;
    }
  </style>
</head>
<body class="bg-pink-100">
  <div id="root"  className="relative">

  </div>
  <img src="./assets/bgpi.webp" width="400px" className="bipi"/>


  <script type="text/babel">
    const { useState } = React;

    function PipoDateAdventure() {
      const [step, setStep] = useState(0);
      const [accepted, setAccepted] = useState(false);

      const scenes = [
        {
          title: "Pipo: 3andi serr bch n9olik alih 🐶 Hao !",
          img: "./assets/pipo1.webp",
          story:
            "I'm running toward's you with sparkling eyes... I'm excited because i wants to tell you a very important story.",
        },
        {
          title: "Hao ! La7tha 9bal Mama ✨",
          img: "",
          story:
            "Mama i want to says thank you for saving me taking care of me and loving me all this years,we shared life have some hard moments but full of beautiful moments.you deserves love mama, laughter, and beautiful dates 🌸",
        },
        {
          title: "Nhebek barcha Mamati ✨ Hao !",
          img: "",
          story:
            "Ma7lek Mama w ya2a7an 9alb 🌸 Hao ! Hao !",
        },
        {
          title: "The Little Serr ✨ Hao !",
          img: "",
          story:
            "Fama chkoun 3tani amena, wena bch nwassalthelk kima rabitni nwassel el amena mama 🌸 Hao !",
        },
        
        {
          title: "The Hidden Letter 💌 Hao !",
          img: "",
          story: "Mama ! el Amena hia jweb, ",
        },
      ];

      const pipoImages = [
        "./assets/pipo1.webp",
        "./assets/pipo2.webp",
        "./assets/pipo3.webp",
        "./assets/pipo3.webp",
        "./assets/pipo4.webp",
      ];
      const currentScene = scenes[step];

      const nextStep = () => {
        if (step === scenes.length - 1) {
          setAccepted(true);
        } else {
          setStep(step + 1);
        }
      };

      const resetGame = () => {
        setStep(0);
        setAccepted(false);
      };

      if (accepted) {
        return (
          <div className="min-h-screen bg-pink-100 flex items-center justify-center p-6">
            
            <div className="rounded-3xl max-w-[45rem] min-h-[50rem] p-10 text-center space-y-6 bg-letter">
              <div className="rounded-3xl max-w-xl p-20 text-center space-y-6">
                <div className="text-7xl">💖</div>

                <h1 className="text-4xl font-bold text-pink-600">
                  A Letter From Pipo 💌
                </h1>

                <p className="text-lg text-gray-700">
                  Pipo carefully places the letter in your hands 🐾
                </p>

                <div className="rounded-2xl p-6 border border-pink-200">
                  <p className="text-2xl font-semibold text-gray-800">
                    “Sometimes a little dog can notice when two hearts belong together.” 💖
                  </p>

                  <p className="mt-4 text-gray-600 text-lg">
                    Will you go on a romantic date with me this Saturday? 🌸✨
                  </p>
                </div>

                <button
                  onClick={resetGame}
                  className="px-6 py-3 rounded-2xl bg-pink-500 text-white font-medium hover:scale-105 transition"
                >
                  Replay Adventure
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (

        <div className="min-h-screen bg-gradient-to-br from-pink-100 via-rose-50 to-orange-100 flex items-center justify-center p-6">

          <div className="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden">

            {/* HEADER */}
            <div className="bg-pink-500 p-6 text-white">
              <div className="flex items-center justify-between">
                <h1 className="text-3xl font-bold">Pipo Adventure 🐾</h1>

                <span className="bg-white/20 px-4 py-2 rounded-full text-sm">
                  Step {step + 1} / {scenes.length}
                </span>
              </div>

              {/* PROGRESS BAR */}
              <div className="w-full bg-white/20 rounded-full h-3 mt-5 overflow-hidden">
                <div
                  className="bg-white h-3 rounded-full transition-all duration-500"
                  style={{ width: `${((step + 1) / scenes.length) * 100}%` }}
                ></div>
              </div>

              {/* MAP */}
              <div className="mt-8 bg-white/10 rounded-2xl p-4">
                <div className="relative flex items-center justify-between">

                  <div className="absolute top-1/2 left-0 w-full h-1 bg-white/20 -translate-y-1/2 rounded-full"></div>

                  {[0, 1, 2, 3, 4, 5].map((item) => (
                    <div
                      key={item}
                      className={`relative z-10 flex flex-col items-center transition-all duration-500 ${
                        step >= item ? "scale-110" : "opacity-60"
                      }`}
                    >
                      <div
                        className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl border-4 ${
                          step >= item
                            ? "bg-white text-pink-500 border-pink-200"
                            : "bg-pink-300 text-white border-white/30"
                        }`}
                      >
                        {item === 0 && "🏡"}
                        {item === 1 && "🌳"}
                        {item === 2 && "🌳"}
                        {item === 3 && "🌳"}
                        {item === 4 && "💌"}
                        {item === 5 && "📜"}
                      </div>

                      {step === item && (
                        <div className="mt-2 text-3xl animate-bounce">
                          <img src="./assets/pipo2.webp" width="50px"/>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* BODY */}
            <div className="p-8 space-y-8">
              <div className="text-center space-y-4">
                <div className="text-6xl text-center m-auto flex justify-center">
                  <img src={pipoImages[step]} width="200px"/>
                  </div>

                <h2 className="text-3xl font-bold text-gray-800">
                  {currentScene.title}
                </h2>

                <p className="text-lg text-gray-600">
                  {currentScene.story}
                </p>
              </div>

              <div className="flex justify-center">
                <button
                  onClick={nextStep}
                  className="px-8 py-4 rounded-2xl bg-pink-500 text-white font-semibold hover:scale-105 transition shadow-lg"
                >
                  {step === scenes.length - 1 ? "Open The Letter 💌" : "Continue ✨"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <PipoDateAdventure />
    );
  </script>
</body>
</html>
